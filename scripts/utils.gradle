project.group = "com.ferra13671"

base {
    archivesName = project.ext.projectName
}

repositories {
    maven {
        name = 'ferra13671-maven'
        url = 'https://ferra13671.github.io/maven/'
    }
    mavenCentral()
    mavenLocal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

java {
    if (project.with_sources) {
        withSourcesJar()
    }
}

dependencies {
    compileOnly("org.projectlombok:lombok:${project.lombok_version}")
    annotationProcessor("org.projectlombok:lombok:${project.lombok_version}")

    compileOnly "org.apiguardian:apiguardian-api:${apiguardian_version}"
}